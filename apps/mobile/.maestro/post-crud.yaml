appId: dev.socialhub.app
---
- launchApp
- tapOn: "Log in"
- inputText:
    field: "Email"
    text: "demo@socialhub.dev"
- inputText:
    field: "Password"
    text: "Demo123!"
- tapOn: "Log In"
- assertVisible: "Feed"
- tapOn: "Create"
- inputText:
    field: "Title"
    text: "Maestro test post"
- inputText:
    field: "Content"
    text: "Posted by an automated E2E flow."
- tapOn: "Publish"
- assertVisible: "Maestro test post"
- tapOn: "Maestro test post"
- assertVisible: "Posted by an automated E2E flow."
- tapOn: "Edit"
- inputText:
    field: "Title"
    text: "Maestro test post (edited)"
- tapOn: "Save"
- assertVisible: "Maestro test post (edited)"
- tapOn: "Delete"
- tapOn: "Confirm"
